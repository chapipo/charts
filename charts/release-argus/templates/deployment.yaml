apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "release-argus.fullname" . }}
  labels:
    {{- include "release-argus.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RWO volume + SQLite database: never run two pods at once
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "release-argus.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret-config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "release-argus.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "release-argus.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Seed config.yml into the data volume (only if missing, unless config.overwrite)
        - name: seed-config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              if [ "{{ .Values.config.overwrite }}" = "true" ] || [ ! -f /app/data/config.yml ]; then
                echo "Seeding /app/data/config.yml"
                cp /seed/config.yml /app/data/config.yml
                chown {{ .Values.argus.uid }}:{{ .Values.argus.gid }} /app/data/config.yml
                chmod 600 /app/data/config.yml
              else
                echo "/app/data/config.yml already exists, keeping it"
              fi
          volumeMounts:
            - name: seed
              mountPath: /seed
              readOnly: true
            - name: data
              mountPath: /app/data
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -config.file=/app/data/config.yml
            {{- range .Values.argus.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: ARGUS_UID
              value: {{ .Values.argus.uid | quote }}
            - name: ARGUS_GID
              value: {{ .Values.argus.gid | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/healthcheck
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        {{- with .Values.sidecars }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      volumes:
        - name: seed
          secret:
            secretName: {{ include "release-argus.fullname" . }}-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "release-argus.fullname" . }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
