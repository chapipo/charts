# Default values for release-argus.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: releaseargus/argus
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

# The image entrypoint starts as root, fixes file ownership, then drops
# privileges to argus.uid/argus.gid. Do not set runAsNonRoot unless you
# also handle file ownership yourself.
securityContext: {}

argus:
  # UID/GID the Argus process runs as (ARGUS_UID / ARGUS_GID)
  uid: 911
  gid: 911
  # Extra command-line flags passed to the argus binary
  extraArgs: []
    # - -log.level=DEBUG

## Argus configuration (config.yml), see https://release-argus.io/docs/config/
## It is stored in a Secret (it often contains notification tokens) and copied
## into the data volume by an init container. By default the copy only happens
## when no config exists yet, so changes made through the web UI are kept.
config:
  # true = overwrite the config in the volume with these values on every pod start
  # (web UI changes are then lost on restart)
  overwrite: false
  content:
    settings:
      log:
        level: INFO
      web:
        listen_host: 0.0.0.0
        listen_port: "8080"
    service: {}
      # release-argus:
      #   latest_version:
      #     type: github
      #     url: release-argus/Argus

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

## HTTPRoute (Gateway API), alternative or complement to the Ingress.
## Requires the Gateway API CRDs and an existing Gateway (see parentRefs).
httpRoute:
  enabled: false
  annotations: {}
  labels: {}
  # Gateway(s) the route attaches to
  parentRefs:
    - name: gateway
      namespace: ""           # empty = release namespace
      sectionName: ""         # specific Gateway listener (optional)
  hostnames:
    - argus.example.lan
  # Rules: backendRefs is always generated by the chart (web UI service).
  # If "matches" is omitted, the Gateway defaults to PathPrefix "/".
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters: []

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

## Data volume (/app/data): SQLite database (argus.db) and config.yml
storage:
  annotations: {}
  size: 1Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

# Extra containers in the Argus pod
sidecars: []

nodeSelector: {}

tolerations: []

affinity: {}
