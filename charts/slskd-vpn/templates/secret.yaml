{{- if not .Values.secrets.existingSecret }}
{{- $name := include "slskd-vpn.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $data := dict }}
{{- if $existing }}
{{- $data = $existing.data | default dict }}
{{- end }}
{{- $v := .Values.secrets.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "slskd-vpn.labels" . | nindent 4 }}
type: Opaque
data:
  soulseek-username: {{ required "secrets.values.soulseekUsername is required (or use secrets.existingSecret)" $v.soulseekUsername | b64enc | quote }}
  soulseek-password: {{ required "secrets.values.soulseekPassword is required (or use secrets.existingSecret)" $v.soulseekPassword | b64enc | quote }}
  web-username: {{ required "secrets.values.webUsername is required" $v.webUsername | b64enc | quote }}
  web-password: {{ include "slskd-vpn.secretValue" (dict "provided" $v.webPassword "existing" $data "key" "web-password" "length" 24) | quote }}
  api-key: {{ include "slskd-vpn.secretValue" (dict "provided" $v.apiKey "existing" $data "key" "api-key" "length" 32) | quote }}
  gluetun-api-key: {{ include "slskd-vpn.secretValue" (dict "provided" $v.gluetunApiKey "existing" $data "key" "gluetun-api-key" "length" 32) | quote }}
  {{- if .Values.gluetun.enabled }}
  {{- if eq .Values.gluetun.vpn.type "wireguard" }}
  wireguard-private-key: {{ required "secrets.values.wireguardPrivateKey is required when gluetun.vpn.type=wireguard" $v.wireguardPrivateKey | b64enc | quote }}
  {{- else if eq .Values.gluetun.vpn.type "openvpn" }}
  openvpn-username: {{ required "secrets.values.openvpnUsername is required when gluetun.vpn.type=openvpn" $v.openvpnUsername | b64enc | quote }}
  openvpn-password: {{ required "secrets.values.openvpnPassword is required when gluetun.vpn.type=openvpn" $v.openvpnPassword | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
