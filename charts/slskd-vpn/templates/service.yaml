apiVersion: v1
kind: Service
metadata:
  name: {{ include "slskd-vpn.fullname" . }}
  labels:
    {{- include "slskd-vpn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "slskd-vpn.selectorLabels" . | nindent 4 }}
{{- if and (not .Values.gluetun.enabled) .Values.service.listen.enabled }}
---
# Soulseek listen port, only without VPN (with gluetun, the port comes from the VPN)
apiVersion: v1
kind: Service
metadata:
  name: {{ include "slskd-vpn.fullname" . }}-listen
  labels:
    {{- include "slskd-vpn.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.listen.type }}
  ports:
    - name: listen
      port: {{ .Values.slskd.listenPort }}
      targetPort: listen
      protocol: TCP
  selector:
    {{- include "slskd-vpn.selectorLabels" . | nindent 4 }}
{{- end }}
