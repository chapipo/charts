{{- if include "soularr.needsSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "soularr.fullname" . }}
  labels:
    {{- include "soularr.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if not .Values.apiKeys.lidarr.existingSecret.name }}
  lidarr-api-key: {{ required "apiKeys.lidarr.value is required (or set apiKeys.lidarr.existingSecret)" .Values.apiKeys.lidarr.value | b64enc | quote }}
  {{- end }}
  {{- if not .Values.apiKeys.slskd.existingSecret.name }}
  slskd-api-key: {{ required "apiKeys.slskd.value is required (or set apiKeys.slskd.existingSecret)" .Values.apiKeys.slskd.value | b64enc | quote }}
  {{- end }}
{{- end }}
